apiVersion: v1
kind: Namespace
metadata:
  name: etnair
---
# Secret PostgreSQL
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: etnair
type: Opaque
data:
  POSTGRES_PASSWORD: ZXRuYWlyX3Bhc3M=  # 'etnair_pass' en base64
---
# Déploiement PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: etnair
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "etnair_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "etnair_db"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
      volumes:
      - name: postgres-data
        emptyDir: {}
---
# Service PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: etnair
spec:
  selector:
    app: postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
# Déploiement API (test avec nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: etnair
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: nginx:latest
        ports:
        - containerPort: 80
---
# Service API
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: etnair
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80
  type: NodePort
---
# Namespace pour Portainer
apiVersion: v1
kind: Namespace
metadata:
  name: portainer
---
# Service Account Portainer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-sa
  namespace: portainer
---
# Déploiement Portainer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      serviceAccountName: portainer-sa
      containers:
      - name: portainer
        image: portainer/portainer-ce:latest
        ports:
        - containerPort: 9000
        volumeMounts:
        - mountPath: /data
          name: portainer-data
      volumes:
      - name: portainer-data
        emptyDir: {}
---
# Service Portainer
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: portainer
spec:
  selector:
    app: portainer
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  type: NodePort
